{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>AngelicaAI | {% block title %}{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <style>
        body { margin: 0; background: #111; color: #fff; }
        .page-header { padding: 1.5rem 0; }
        .page-header h1 { margin: 0; font-size: 1.8rem; }
        .card { background: rgba(0, 0, 0, 0.75); border: 1px solid rgba(255,255,255,0.08); }
        .form-control { background: rgba(255, 255, 255, 0.08); color: #fff; border: 1px solid rgba(255,255,255,0.12); }
        .form-control:focus { background: rgba(255, 255, 255, 0.12); color: #fff; }
        .btn-primary { background: #5c6ac4; border-color: #4a55a1; }
        .message-box { margin-bottom: 1rem; }
        .webgl { width: 100%; display: block; border-radius: 0.4rem; }
        .chat-log { flex: 1 1 auto; min-height: 220px; max-height: 360px; overflow-y: auto;
            background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.08);
            border-radius: 0.4rem; padding: 0.75rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .chat-bubble { padding: 0.5rem 0.75rem; border-radius: 0.6rem; max-width: 85%;
            white-space: pre-wrap; word-wrap: break-word; line-height: 1.35; }
        .chat-user { align-self: flex-end; background: #5c6ac4; color: #fff; }
        .chat-assistant { align-self: flex-start; background: rgba(255,255,255,0.10); color: #f1f1f1; }
        .chat-error { background: #6a2230; color: #ffd7d7; }
        #chat-mic.listening { background: #c0392b; border-color: #c0392b; color: #fff;
            animation: mic-pulse 1s ease-in-out infinite; }
        @keyframes mic-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">AngelicaAI Assistant</a>
        </div>
    </nav>

    <main class="container py-4">
        {% if messages %}
            <div class="message-box">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}

        {% block content %}{% endblock content %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</body>
</html>
